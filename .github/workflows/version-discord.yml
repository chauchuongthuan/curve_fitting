# .github/workflows/version-discord.yml
name: Auto Version & Discord Notification

on:
  push:
    branches: [ master, main ]
  pull_request:
    types: [ closed ]
    branches: [ master, main ]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  version-and-notify:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_GIT }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Setup Git
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'

      - name: Bump version
        id: version
        run: |
          # Lấy current version
          CURRENT_VERSION=$(cat version.txt 2>/dev/null || echo "0.1.0")
          echo "Current version: $CURRENT_VERSION"

          # Lấy commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Chạy version manager để get new version
          NEW_VERSION=$(python version_manager.py "$COMMIT_MSG")
          echo "New version: $NEW_VERSION"

          # Set outputs
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "old_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Update version file
          echo "$NEW_VERSION" > version.txt

          # Commit và tag
          git add version.txt
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git tag -a "v$NEW_VERSION" -m "Version $NEW_VERSION"
          git push && git push --tags
        env:
          TOKEN_GIT: ${{ secrets.TOKEN_GIT }}

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GIT }}
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          release_name: Release v${{ steps.version.outputs.new_version }}
          body: |
            Version ${{ steps.version.outputs.new_version }}

            Changes in this release:
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false

      - name: Send Discord Notification
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            🚀 New Release framework!
            Version: v${{ steps.version.outputs.new_version }} (from v${{ steps.version.outputs.old_version }})

            **Changes:**
            ```
            ${{ github.event.head_commit.message }}
            ```

            [View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.new_version }})
